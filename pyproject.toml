[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jessnet"
version = "0.1.0"
description = "JESSNet: Joint dEconvolution and Sparse Separation Network for 21 cm foreground cleaning"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.21",
    "scipy>=1.7",
    "healpy>=1.15",
    "h5py>=3.0",
    "joblib>=1.1",
    "numba>=0.56",
    "matplotlib>=3.4",
    "torch>=1.12",
]

[tool.setuptools.packages.find]
include = ["jessnet*"]
